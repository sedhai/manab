<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manab's 9th Birthday Invitation</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tone.js for the 8-bit tune -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #121417;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 32px 32px;
            color: white;
            overflow-x: hidden;
            min-height: 100vh;
        }
        .roblox-font { font-family: 'Bungee', cursive; }
        .roblox-btn {
            background: #e52521;
            border-bottom: 5px solid #8B0000;
            transition: all 0.1s ease;
        }
        .roblox-btn:hover { filter: brightness(1.1); }
        .roblox-btn:active {
            border-bottom: 0px;
            transform: translateY(5px);
        }
        .card-bg {
            background: rgba(26, 29, 36, 0.94);
            border: 3px solid #3c424f;
            box-shadow: 0 16px 36px rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
        }

        /* Welcome Banner */
        #custom-welcome-banner {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: #FFD700;
            color: #111;
            padding: 15px 30px;
            border-radius: 10px;
            border: 4px solid #fff;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            z-index: 100;
            transition: top 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
        }

        /* Characters Stage & CSS Models */
        #roblox-characters-stage {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 30;
        }

        .rbx-character {
            position: absolute;
            width: 46px; /* slightly smaller to fit screen */
            height: 72px;
            cursor: pointer;
            pointer-events: auto;
            transform-origin: center center;
            user-select: none;
            filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.6));
            will-change: transform;
        }

        .rbx-head {
            position: absolute; top: 0; left: 13px; width: 20px; height: 18px;
            border-radius: 3px; border: 2px solid #111; box-sizing: border-box;
            display: flex; align-items: center; justify-content: center;
            font-size: 8px; line-height: 1;
        }
        .rbx-torso {
            position: absolute; top: 18px; left: 10px; width: 26px; height: 28px;
            border-radius: 2px; border: 2px solid #111; box-sizing: border-box;
        }
        .rbx-arm-l {
            position: absolute; top: 18px; left: 0px; width: 10px; height: 28px;
            border-radius: 2px; border: 2px solid #111; box-sizing: border-box;
        }
        .rbx-arm-r {
            position: absolute; top: 18px; right: 0px; width: 10px; height: 28px;
            border-radius: 2px; border: 2px solid #111; box-sizing: border-box;
        }
        .rbx-leg-l {
            position: absolute; top: 46px; left: 10px; width: 12px; height: 26px;
            border-radius: 0 0 2px 2px; border: 2px solid #111; box-sizing: border-box;
        }
        .rbx-leg-r {
            position: absolute; top: 46px; right: 10px; width: 12px; height: 26px;
            border-radius: 0 0 2px 2px; border: 2px solid #111; box-sizing: border-box;
        }
        .rbx-bubble {
            position: absolute; top: -24px; left: 50%; transform: translateX(-50%);
            background: white; color: #111; font-family: 'Bungee', cursive;
            font-size: 9px; padding: 2px 6px; border-radius: 4px; border: 2px solid #000;
            white-space: nowrap; opacity: 0; pointer-events: none;
        }
        .rbx-character.oof .rbx-bubble {
            opacity: 1; transform: translateX(-50%) translateY(-4px); transition: opacity 0.2s, transform 0.2s;
        }
        .rbx-character.hovered { filter: drop-shadow(0 0 12px rgba(255, 235, 59, 0.9)); }
        
        .rbx-letter {
            position: absolute; top: -45px; left: 50%; transform: translateX(-50%);
            font-family: 'Bungee', cursive; font-size: 36px; color: #fff;
            text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 4px 10px rgba(0,0,0,0.8);
            opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }
        .rbx-character.has-letter .rbx-letter { opacity: 1; }
    </style>

    <!-- CONFIGURATION VARIABLES -->
    <script>
        window.PARTY_CONFIG = {
            childName: "Manab",
            birthdayAge: "9th",
            partyDateText: "Wednesday, January 6, 2027",
            countdownTarget: "2027-01-06T00:00:00",
            partyTimeText: "TBD — Coming Soon!",
            partyVenueName: "Venue To Be Announced",
            partyVenueAddress: "Stay tuned! We will update you with exact directions soon.",
            formSubmitEmail: "manab@sedhai.com"
        };
    </script>
</head>
<body class="relative flex flex-col items-center justify-center p-4">

    <div id="custom-welcome-banner" class="roblox-font text-2xl"></div>
    <div id="roblox-characters-stage"></div>

    <!-- WELCOME MODAL -->
    <div id="welcome-modal" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-black bg-opacity-95 p-4 transition-opacity duration-500">
        <div class="card-bg p-8 rounded-xl text-center max-w-md w-full relative z-50">
            <div class="inline-block bg-red-600 text-white roblox-font text-xs uppercase px-3 py-1 rounded mb-3 tracking-wider">
                Official Invite
            </div>
            <h1 class="roblox-font text-3xl mb-4 text-white">You're Invited!</h1>
            <p id="welcome-instruction" class="mb-4 text-gray-300">Who is opening this invitation?</p>
            
            <input type="text" id="guest-name-input" placeholder="Enter Child's Name..." class="w-full bg-gray-900 border border-gray-600 rounded p-3 text-white focus:outline-none focus:border-yellow-400 text-center mb-6 text-lg roblox-font">
            
            <button onclick="openInvitation()" class="roblox-font roblox-btn w-full py-4 rounded text-xl text-white shadow-lg cursor-pointer">
                OPEN INVITATION
            </button>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div id="main-content" class="max-w-2xl w-full hidden opacity-0 transition-opacity duration-1000 my-8 relative z-20">
        <!-- Header -->
        <div class="card-bg rounded-xl p-8 mb-6 text-center border-t-8 border-t-red-600">
            <h1 class="roblox-font text-4xl md:text-5xl text-white mb-2 tracking-wide">
                <span id="display-name">Manab</span>'s <span id="display-age" class="text-red-500">9th</span> Level Up!
            </h1>
            <p class="text-xl text-gray-300 mt-2">You are officially invited to celebrate with us!</p>
            
            <div class="mt-6 bg-black bg-opacity-60 p-4 rounded-lg inline-block border border-gray-700">
                <p class="text-xs text-gray-400 uppercase tracking-widest roblox-font">Countdown to Party Time</p>
                <div id="countdown" class="roblox-font text-2xl md:text-3xl text-yellow-400 mt-2">Loading...</div>
            </div>
        </div>

        <!-- Details -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div class="card-bg rounded-xl p-6">
                <h3 class="roblox-font text-xl text-yellow-400 mb-3 border-b border-gray-700 pb-2">📅 When</h3>
                <p id="display-date" class="font-bold text-lg text-white"></p>
                <p id="display-time" class="text-gray-300 mt-1"></p>
            </div>
            <div class="card-bg rounded-xl p-6">
                <h3 class="roblox-font text-xl text-yellow-400 mb-3 border-b border-gray-700 pb-2">📍 Where</h3>
                <p id="display-venue" class="font-bold text-lg text-white"></p>
                <p id="display-address" class="text-gray-300 mt-1 text-sm"></p>
            </div>
        </div>

        <!-- RSVP -->
        <div class="card-bg rounded-xl p-8">
            <h2 class="roblox-font text-2xl text-center mb-6 text-white tracking-wide">RSVP for Parents</h2>
            <form id="rsvp-form" method="POST" class="space-y-4">
                <input type="hidden" name="_subject" value="New Birthday RSVP for Manab!">
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_template" value="table">
                <input type="hidden" name="_autoresponse" value="Thank you for RSVPing to Manab's 9th Birthday! We have received your response.">
                <input type="hidden" name="_replyto" id="reply-to" value="">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-300 mb-1">Child's Name *</label>
                        <input type="text" name="Child_Name" id="rsvp-child-name" required class="w-full bg-gray-900 border border-gray-700 rounded p-3 text-white">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-300 mb-1">Parent's Name *</label>
                        <input type="text" name="Parent_Name" required class="w-full bg-gray-900 border border-gray-700 rounded p-3 text-white">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-300 mb-1">Parent's Email *</label>
                    <input type="email" name="email" required class="w-full bg-gray-900 border border-gray-700 rounded p-3 text-white">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-300 mb-1">Food Allergies / Dietary</label>
                    <input type="text" name="Allergies" placeholder="e.g. Peanuts, None" class="w-full bg-gray-900 border border-gray-700 rounded p-3 text-white">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-300 mb-1">Recommendations or Notes</label>
                    <textarea name="Recommendations" rows="3" class="w-full bg-gray-900 border border-gray-700 rounded p-3 text-white"></textarea>
                </div>
                <button type="submit" class="roblox-font roblox-btn w-full py-4 mt-4 rounded text-xl text-white shadow-lg">SEND RSVP</button>
            </form>
        </div>
    </div>

    <script>
        // 1. Initial Setup
        document.getElementById('display-name').innerText = window.PARTY_CONFIG.childName;
        document.getElementById('display-age').innerText = window.PARTY_CONFIG.birthdayAge;
        document.getElementById('display-date').innerText = window.PARTY_CONFIG.partyDateText;
        document.getElementById('display-time').innerText = window.PARTY_CONFIG.partyTimeText;
        document.getElementById('display-venue').innerText = window.PARTY_CONFIG.partyVenueName;
        document.getElementById('display-address').innerText = window.PARTY_CONFIG.partyVenueAddress;
        document.getElementById('rsvp-form').action = `https://formsubmit.co/${window.PARTY_CONFIG.formSubmitEmail}`;
        document.getElementById('reply-to').value = window.PARTY_CONFIG.formSubmitEmail;

        // 2. LocalStorage & Name Management
        const nameInput = document.getElementById('guest-name-input');
        const rsvpChildName = document.getElementById('rsvp-child-name');
        
        let guestName = localStorage.getItem('guestName') || new URLSearchParams(window.location.search).get('guest');
        
        if (guestName) {
            nameInput.value = guestName;
            document.getElementById('welcome-instruction').innerText = `Welcome back, ${guestName}!`;
        }

        // 3. Countdown
        const targetDate = new Date(window.PARTY_CONFIG.countdownTarget).getTime();
        setInterval(() => {
            const now = new Date().getTime();
            const dist = targetDate - now;
            if (dist < 0) return document.getElementById("countdown").innerHTML = "IT'S PARTY TIME!";
            const d = Math.floor(dist / (1000 * 60 * 60 * 24));
            const h = Math.floor((dist % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((dist % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((dist % (1000 * 60)) / 1000);
            document.getElementById("countdown").innerHTML = `${d}d ${h}h ${m}m ${s}s`;
        }, 1000);

        // 4. Open Action & Performance Sequence
        function openInvitation() {
            let enteredName = nameInput.value.trim();
            if (!enteredName) {
                nameInput.classList.add('border-red-500');
                nameInput.placeholder = "Please enter your name!";
                return;
            }
            
            // Save & Set
            localStorage.setItem('guestName', enteredName);
            rsvpChildName.value = enteredName;

            // UI Transitions
            const modal = document.getElementById('welcome-modal');
            modal.style.opacity = '0';
            setTimeout(() => modal.style.display = 'none', 500);

            const content = document.getElementById('main-content');
            content.classList.remove('hidden');
            setTimeout(() => content.style.opacity = '1', 100);

            // Welcome Banner
            const banner = document.getElementById('custom-welcome-banner');
            banner.innerText = `Welcome ${enteredName}! Let's Party!`;
            banner.style.top = '20px';
            setTimeout(() => banner.style.top = '-100px', 400);

            // Audio & Confetti
            playBirthdayTune();
            confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 }, colors: ['#e52521', '#ffffff', '#FFD700'] });

            // Start Choreography
            startChoreography();
        }

        async function playBirthdayTune() {
            try {
                await Tone.start();
                const synth = new Tone.Synth({ oscillator: { type: "square" }, envelope: { attack: 0.05, decay: 0.2, sustain: 0.2, release: 1 } }).toDestination();
                synth.volume.value = -10;
                const now = Tone.now();
                synth.triggerAttackRelease("G4", "8n", now);
                synth.triggerAttackRelease("G4", "8n", now + 0.3);
                synth.triggerAttackRelease("A4", "4n", now + 0.6);
                synth.triggerAttackRelease("G4", "4n", now + 1.2);
                synth.triggerAttackRelease("C5", "4n", now + 1.8);
                synth.triggerAttackRelease("B4", "2n", now + 2.4);
            } catch(e) {}
        }

        // 5. Choreography Engine
        const themes = [
            { head: "#FFE600", torso: "#0055FF", leg: "#98FB98", arm: "#FFE600", face: "•‿•" },
            { head: "#F5C396", torso: "#D32F2F", leg: "#37474F", arm: "#F5C396", face: "¬‿¬" },
            { head: "#FFE600", torso: "#212121", leg: "#1565C0", arm: "#FFE600", face: "•_•" },
            { head: "#F5C396", torso: "#FF9800", leg: "#424242", arm: "#F5C396", face: "★‿★" },
            { head: "#E0F7FA", torso: "#00BCD4", leg: "#006064", arm: "#E0F7FA", face: "^‿^" }
        ];

        const targetPhrase = "HAPPY BIRTHDAY MANAB"; // 18 letters
        const lettersArr = targetPhrase.replace(/ /g, '').split('');

        class ChoreographedCharacter {
            constructor(letter, index, stage) {
                this.letter = letter;
                this.index = index;
                this.stage = stage;
                this.theme = themes[Math.floor(Math.random() * themes.length)];
                
                this.width = 46; this.height = 72;
                this.x = Math.random() * window.innerWidth;
                this.y = Math.random() * window.innerHeight;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = -(6 + Math.random() * 8);
                
                this.state = 'BOUNCING'; // BOUNCING, EXITING, ENTERING, LINING_UP, SCRAMMING
                this.targetX = 0; this.targetY = 0;
                this.isPerforming = false; // Prevents hover/click interference

                this.el = document.createElement('div');
                this.el.className = 'rbx-character';
                this.el.innerHTML = `
                    <div class="rbx-bubble">OOF!</div>
                    <div class="rbx-letter">${this.letter}</div>
                    <div class="rbx-head" style="background:${this.theme.head}">${this.theme.face}</div>
                    <div class="rbx-torso" style="background:${this.theme.torso}"></div>
                    <div class="rbx-arm-l" style="background:${this.theme.arm}"></div>
                    <div class="rbx-arm-r" style="background:${this.theme.arm}"></div>
                    <div class="rbx-leg-l" style="background:${this.theme.leg}"></div>
                    <div class="rbx-leg-r" style="background:${this.theme.leg}"></div>
                `;
                this.stage.appendChild(this.el);

                // Normal interactions
                this.el.addEventListener('mouseenter', () => {
                    if (!this.isPerforming && this.state === 'BOUNCING') this.el.classList.add('hovered');
                });
                this.el.addEventListener('mouseleave', () => this.el.classList.remove('hovered'));
                
                const scare = (e) => {
                    if (!this.isPerforming && this.state === 'BOUNCING') {
                        this.state = 'SCRAMMING';
                        this.el.classList.remove('hovered');
                        this.el.classList.add('oof');
                        this.vx = (Math.random() > 0.5 ? 1 : -1) * 15;
                        this.vy = -15;
                        setTimeout(() => { this.state = 'BOUNCING'; this.el.classList.remove('oof'); this.y = -50; }, 2000);
                    }
                };
                this.el.addEventListener('click', scare);
                this.el.addEventListener('touchstart', scare, {passive: true});
            }

            update(targets) {
                const ground = window.innerHeight - this.height;
                const facing = this.vx >= 0 ? 1 : -1;
                let tilt = 0;

                if (this.state === 'BOUNCING' || this.state === 'SCRAMMING' || this.state === 'EXITING') {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vy += 0.3; // Gravity

                    if (this.state === 'BOUNCING') {
                        if (this.x < 0 || this.x > window.innerWidth - this.width) this.vx *= -1;
                        if (this.y >= ground) { this.y = ground; this.vy = -(8 + Math.random() * 6); }
                        tilt = Math.sin(Date.now() / 150) * 6;
                    }
                } 
                else if (this.state === 'ENTERING' || this.state === 'LINING_UP') {
                    const t = targets[this.index];
                    this.x += (t.x - this.x) * 0.08;
                    this.y += (t.y - this.y) * 0.08;
                    
                    if (Math.abs(t.x - this.x) < 2 && Math.abs(t.y - this.y) < 2) {
                        this.state = 'LINING_UP'; // Lock in place
                    }
                }

                const spin = (this.state === 'SCRAMMING' || this.state === 'EXITING') ? (this.vx > 0 ? 1 : -1) * (this.vy * 2) : tilt;
                this.el.style.transform = `translate3d(${this.x}px, ${this.y}px, 0) scaleX(${this.state === 'LINING_UP' ? 1 : facing}) rotate(${spin}deg)`;
            }
        }

        const stage = document.getElementById('roblox-characters-stage');
        const characters = lettersArr.map((l, i) => new ChoreographedCharacter(l, i, stage));
        let formationTargets = [];

        function calculateTargets() {
            const targets = [];
            // Rows: HAPPY (5), BIRTHDAY (8), MANAB (5)
            const rows = [5, 8, 5];
            const charW = 46; const gap = window.innerWidth < 600 ? 5 : 15;
            const startY = 120; const rowH = 100;
            let cIndex = 0;

            rows.forEach((len, r) => {
                const totalW = len * charW + (len - 1) * gap;
                const startX = (window.innerWidth - totalW) / 2;
                for(let i=0; i<len; i++) {
                    targets.push({ x: startX + i * (charW + gap), y: startY + r * rowH });
                }
            });
            return targets;
        }

        function animate() {
            formationTargets = calculateTargets();
            characters.forEach(c => c.update(formationTargets));
            requestAnimationFrame(animate);
        }
        requestAnimationFrame(animate);

        // Sequence Logic
        function startChoreography() {
            // 1. Rocket out
            characters.forEach(c => {
                c.isPerforming = true;
                c.state = 'EXITING';
                c.vx = (Math.random() - 0.5) * 20;
                c.vy = -20 - Math.random() * 10;
            });

            // 2. Re-enter from top with letters
            setTimeout(() => {
                characters.forEach(c => {
                    c.el.classList.add('has-letter');
                    c.y = -100;
                    c.x = Math.random() * window.innerWidth;
                    c.state = 'ENTERING';
                });
            }, 1500);

            // 3. Hold formation, then Scram
            setTimeout(() => {
                characters.forEach(c => {
                    c.state = 'SCRAMMING';
                    c.el.classList.remove('has-letter');
                    c.el.classList.add('oof');
                    c.vx = (Math.random() > 0.5 ? 1 : -1) * (10 + Math.random() * 10);
                    c.vy = -10 - Math.random() * 10;
                });
            }, 7500);

            // 4. Return to normal bouncing
            setTimeout(() => {
                characters.forEach(c => {
                    c.isPerforming = false;
                    c.el.classList.remove('oof');
                    c.state = 'BOUNCING';
                    c.y = -50;
                });
            }, 9500);
        }

        window.addEventListener('resize', calculateTargets);
    </script>
</body>
</html>
